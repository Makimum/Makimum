<svg xmlns="http://www.w3.org/2000/svg" width="157" height="34" viewBox="0 0 157 34" role="img" aria-label="vetta-x.com"><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#d5dde7;white-space:pre}
.dim{fill:#7b8796}.faint{fill:#566170}.g{fill:#4ade80}.c{fill:#38bdf8}
.a{fill:#fbbf24}.r{fill:#fb7185}.v{fill:#a78bfa}.b{font-weight:700}
@media (prefers-reduced-motion:no-preference){
